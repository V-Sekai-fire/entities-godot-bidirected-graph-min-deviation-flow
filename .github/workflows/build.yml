name: build
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install scons==4.6.0

      - name: Build the GDExtension (template_debug)
        run: |
          scons platform=linux target=template_debug -j"$(nproc)"

      - name: List produced binaries
        run: |
          ls -la godot-bigraph-min-deviation-flow/bin/linux/
